<!--
  SmartSeason - Field Monitoring System
  Main HTML Entry Point
  
  Purpose:
  This is the skeleton of the entire frontend application. It provides the mount point 
  for our React app and sets up the initial browser environment.

  How it works:
  1. Defines the 'root' div where React will inject the application.
  2. Loads the main TypeScript entry point (/src/main.tsx) as a module.
  3. Sets global metadata like the page title and favicon.
-->
<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartSeason - Field Monitoring System</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
